[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cartouche"
version = "0.1.0"
description = "Configurateur non officiel du clavier 8BitDo Retro Mechanical et de la souris Retro R8"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
dependencies = ["hidapi"]

[project.scripts]
cartouche = "cartouche.__main__:cli"

[tool.setuptools.packages.find]
include = ["cartouche*"]

[tool.setuptools.package-data]
"cartouche.ui" = ["static/*"]
"cartouche.moteur" = ["exemple.json"]
